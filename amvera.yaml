# Настройки публикации на Amvera.
#
# Собираем через Dockerfile, а не встроенным окружением Node: приложение
# лежит в подпапке mini-app, а Amvera собирает из корня репозитория.
# Dockerfile это разруливает, см. комментарии в нём.

meta:
  environment: docker
  toolchain:
    name: docker

build:
  dockerfile: Dockerfile

run:
  # Панель Amvera рядом с внутренним именем приложения пишет «должно слушать
  # порт 80». Тот же порт задан в Dockerfile переменной PORT.
  containerPort: 80
